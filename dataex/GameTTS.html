<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Game Media Pembelajaran Matematika</title>
    <link rel="icon" type="favicon.ico" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&family=Merienda:wght@300..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&family=Quintessential&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Comic Relief", system-ui;
        text-align: center;
        padding: 20px;
        margin: 0;
        background: linear-gradient(to right, #e0f7fa, #e1bee7);
        min-height: 100vh;
      }

      h1 {
        margin-bottom: 5px;
        color: #333;
      }

      .sumber {
        font-size: 14px;
        color: #555;
        margin-bottom: 5px;
      }

      .cara-button {
        display: inline-block;
        margin-left: 10px;
        padding: 5px 10px;
        font-size: 13px;
        background-color: #007acc;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        cursor: pointer;
      }

      .cara-button:hover {
        background-color: #005f99;
      }

      .home-button {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 16px;
        background-color: #4caf50;
        color: white;
        text-decoration: none;
        border-radius: 5px;
      }

      .home-button:hover {
        background-color: #45a049;
      }

      .responsive-iframe-container {
        position: relative;
        width: 100%;
        padding-top: 56.25%;
        height: 0;
        overflow: hidden;
      }

      .responsive-iframe-container iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }

      footer {
        margin-top: 40px;
        font-size: 14px;
        color: #777;
      }

      /* ===== POPUP ===== */
      .popup {
        display: none;
        position: fixed;
        z-index: 999;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.6);
      }

      .popup-content {
        background: #fff;
        margin: 10% auto;
        padding: 20px;
        border-radius: 10px;
        width: 80%;
        max-width: 500px;
        text-align: left;
        position: relative;
      }

      .popup-content h2 {
        margin-top: 0;
      }

      .close-btn {
        position: absolute;
        right: 15px;
        top: 10px;
        font-size: 20px;
        font-weight: bold;
        color: #333;
        cursor: pointer;
      }

      .close-btn:hover {
        color: red;
      }
    </style>
  </head>
  <body>
    <h1>Game Media Pembelajaran Matematika</h1>

    <div class="sumber">
      Dibuat Menggunakan Wordwall
      
    </div>

    <div class="responsive-iframe-container">
      <iframe
        src="https://wordwall.net/id/embed/eba9dac9892944a6966df0c7ba6cd6f3?themeId=46&templateId=48&fontStackId=0"
        allowfullscreen
      ></iframe>
    </div>

    <a
      href="https://nrllllzmnn.github.io/metpedtrigono.github.io/"
      class="home-button"
      >Kembali ke Media Pembelajaran</a
    >

    <footer>
      &copy; 2025 Media Pembelajaran Matematika. All rights reserved.
    </footer>

   
      </div>
    </div>

    <script>
      function openPopup() {
        document.getElementById("popup").style.display = "block";
      }

      function closePopup() {
        document.getElementById("popup").style.display = "none";
      }

      // Tutup popup jika klik area luar
      window.onclick = function (event) {
        let popup = document.getElementById("popup");
        if (event.target == popup) {
          popup.style.display = "none";
        }
      };
    </script>
  </body>
</html>
